<!doctype html>
<html
  lang="en-US"
  xml:lang="en-US"
  xmlns="http://www.w3.org/1999/xhtml"
  prefix="og: http://ogp.me/ns#"
  xmlns:og="http://ogp.me/ns#"
>
  <head>
    <title>Lakota Loop</title>

    <meta charset="UTF-8" />

    <!-- Description for search engines -->
    <meta name="description" content="Watch Halloween at Lakota Loop." />

    <!-- Identify the preferred URL for search engines. -->
    <link rel="canonical" href="https://lakotaloop.stream/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lakotaloop.stream/" />
    <meta property="og:title" content="Lakota Loop | Halloween Video" />
    <meta property="og:description" content="Watch Halloween at Lakota Loop." />
    <meta
      property="og:image"
      content="https://lakotaloop.stream/assets/icon-1200x1200.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta
      property="og:image:alt"
      content="A hooded Halloween skeleton with glowing eyes."
    />

    <!-- Twitter / X: the summary card matches the square sharing image. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://lakotaloop.stream/" />
    <meta name="twitter:title" content="Lakota Loop | Halloween Video" />
    <meta
      name="twitter:description"
      content="Watch Halloween at Lakota Loop."
    />
    <meta
      name="twitter:image"
      content="https://lakotaloop.stream/assets/icon-1200x1200.png"
    />
    <meta
      name="twitter:image:alt"
      content="A hooded Halloween skeleton with glowing eyes."
    />

    <!-- Viewporting
         width=device-width ensures the layout matches the device width
         initial-scale=1.0 sets the default zoom level
         viewport-fit=cover allows the PWA to use the entire screen on devices with display cutouts
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Set the theme color for mobile browsers -->
    <meta name="theme-color" content="#000000" />

    <!-- Link the favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/assets/icon-48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/icon-192x192.png"
    />

    <!-- Add Apple Touch icon (when an iOS device adds the site to their home screen) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icon-180x180.png"
    />

    <!-- Link the web app manifest for usage as a Progressive Web App (PWA) -->
    <link
      rel="manifest"
      type="application/manifest+json"
      href="/manifest.json"
    />
  </head>
  <body>
    <noscript
      ><p>
        Enable JavaScript to browse and watch Lakota Loop movies.
      </p></noscript
    >
    <main id="app">
      <section id="browse-screen" aria-label="Lakota Loop movie library">
        <div id="hero-artwork" aria-hidden="true"></div>
        <div class="library-content">
          <section class="hero-info" aria-labelledby="movie-title">
            <h1 id="movie-title"></h1>
            <div class="movie-facts">
              <span id="movie-resolution" class="resolution-badge"></span>
              <span class="fact-separator" aria-hidden="true">•</span>
              <span id="movie-runtime"></span>
              <span id="movie-studio" class="sr-only"></span>
            </div>
            <div class="movie-description">
              <p id="movie-tagline"></p>
              <p id="movie-plot"></p>
            </div>
            <p class="finish-time">
              <span class="clock-icon" aria-hidden="true"></span
              ><time id="ends-at"></time>
            </p>
          </section>
          <section class="movie-library" aria-labelledby="shelf-title">
            <h2 id="shelf-title">Family Movies</h2>
            <div id="movie-shelf" aria-label="Movies"></div>
            <p id="browse-status" role="status" aria-live="polite"></p>
          </section>
        </div>
        <img
          class="studio-icon"
          src="/assets/icon-512x512.png"
          alt="Lakota Loop"
          width="72"
          height="72"
        />
      </section>
      <section id="player-screen" aria-label="Movie playback" hidden>
        <!-- Reveal the surface before enabling native controls in VideoPlayer. -->
        <video
          id="video-player"
          crossorigin="anonymous"
          playsinline
          preload="metadata"
        ></video>
        <div class="player-fallback">
          <button id="return-button" type="button">Return to movies</button>
          <button id="fullscreen-button" type="button">Enter fullscreen</button>
          <p id="player-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
