<!doctype html>
<html
  lang="en-US"
  xml:lang="en-US"
  xmlns="http://www.w3.org/1999/xhtml"
  prefix="og: http://ogp.me/ns#"
  xmlns:og="http://ogp.me/ns#"
>
  <head>
    <title>Lakota Loop</title>

    <meta charset="UTF-8" />

    <!-- Description for search engines -->
    <meta name="description" content="Halloween at Lakota Loop" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lakotaloop.stream/" />
    <meta property="og:title" content="Lakota Loop" />
    <meta property="og:description" content="Halloween at Lakota Loop" />
    <meta
      property="og:image"
      content="https://lakotaloop.stream/assets/icon-1500x1500.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://lakotaloop.stream/" />
    <meta property="twitter:title" content="Lakota Loop" />
    <meta property="twitter:description" content="Halloween at Lakota Loop" />
    <meta
      property="twitter:image"
      content="https://lakotaloop.stream/assets/icon-1500x1500.png"
    />

    <!-- Viewporting
         width=device-width ensures the layout matches the device width
         initial-scale=1.0 sets the default zoom level
         viewport-fit=cover allows the PWA to use the entire screen on devices with display cutouts
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Set the theme color for mobile browsers -->
    <meta name="theme-color" content="#000000" />

    <!-- Link the favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/assets/icon-48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/icon-192x192.png"
    />

    <!-- Add Apple Touch icon (when an iOS device adds the site to their home screen) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icon-180x180.png"
    />

    <!-- Link the web app manifest for usage as a Progressive Web App (PWA) -->
    <link
      rel="manifest"
      type="application/manifest+json"
      href="/manifest.json"
    />

    <style>
      /* Reset default padding and margin so layout is consistent across browsers */
      * {
        padding: 0;
        margin: 0;
      }

      /* Stretch the app container to fill the viewport and keep the background black */
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
      }

      #app {
        position: relative;
      }

      /* Contain the complete picture; unused space becomes black bars. */
      #background-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        background-color: #000000;
        visibility: hidden;
      }

      /* The only overlay is a keyboard-accessible, centered play button. */
      #play-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        background: #000000;
        color: #ffffff;
        cursor: pointer;
      }

      #play-button[hidden] {
        display: none;
      }

      #play-button:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 6px;
      }

      #play-button:disabled {
        cursor: progress;
      }

      #play-button svg {
        width: 32px;
        height: 32px;
        margin-left: 5px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <main id="app">
      <!-- Play reveals the video before enabling its native controls. -->
      <video
        id="background-video"
        crossorigin="anonymous"
        playsinline
        preload="auto"
        aria-label="Background video"
      ></video>
      <button
        id="play-button"
        type="button"
        aria-label="Play video with sound"
        disabled
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 3v18l15-9z" />
        </svg>
      </button>
    </main>

    <!-- Vite entry point -->
    <script type="module" src="src/index.ts"></script>
  </body>
</html>
