name: Node.js CI

on: [push, pull_request]

jobs:
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node-version: 26

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      # pnpm must be available before setup-node restores its package store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Always install from the lockfile, even when the package store is cached.
      - name: pnpm install
        run: |
          pnpm install --frozen-lockfile

      - name: pnpm audit-ci
        run: |
          pnpm audit-ci

      - name: pnpm lint
        run: |
          pnpm lint

      - name: pnpm build
        run: |
          pnpm build

      - name: pnpm test
        run: |
          pnpm test

      # Commit the tiny generated fixtures so CI never needs Desktop media,
      # ffmpeg, Mux availability, or credentials. Linux codecs/dependencies are
      # installed along with the version-matched Playwright browser binaries.
      - name: Install Playwright browsers and media dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit chrome

      - name: Production browser tests
        run: xvfb-run --auto-servernum pnpm test:e2e
        env:
          # Chrome's proprietary codecs make H.264/AAC coverage explicit on the
          # disposable Linux runner. Local browser installations are untouched.
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome

      - name: Upload browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
