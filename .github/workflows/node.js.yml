name: Node.js CI

on: [push, pull_request]

jobs:
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node-version: 26

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      # pnpm must be available before setup-node restores its package store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Always install from the lockfile, even when the package store is cached.
      - name: pnpm install
        run: |
          pnpm install --frozen-lockfile

      - name: pnpm audit-ci
        run: |
          pnpm audit-ci

      - name: pnpm lint
        run: |
          pnpm lint

      - name: pnpm build
        run: |
          pnpm build

      - name: pnpm test
        run: |
          pnpm test
